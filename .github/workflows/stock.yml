name: Blox Fruits Stock

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

permissions:
  contents: write            # necessário para salvar o state.json

concurrency:
  group: blox-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Checar stock
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WATCH_FRUITS: ${{ vars.WATCH_FRUITS || 'magnet' }}
        run: python stock_bot.py

      - name: Salvar estado
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add state.json
            git commit -m "atualiza state"
            git push
          fi
